<!doctype html>
<html lang="fr">
  <body style="margin:0;background:#f7f8fb;font-family:-apple-system,'Segoe UI',Inter,Arial,sans-serif;color:#0f1222">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #edf0f5;border-radius:12px;padding:32px">
            <tr><td><img src="{{ .SiteURL }}/Image/Izmo.png" alt="Izmo" width="94" height="28" style="display:block;border:0;width:94px;height:28px"></td></tr>
            <tr><td style="padding-top:24px;font-size:16px;font-weight:600">Votre lien de connexion</td></tr>
            <tr><td style="padding-top:8px;font-size:14px;line-height:22px;color:#5c6680">Cliquez sur le bouton ci-dessous pour vous connecter. Ce lien est valable 15 minutes et ne fonctionne qu'une fois.</td></tr>
            <tr>
              <td style="padding-top:24px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#5d64f4;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:8px">Se connecter à Izmo</a>
              </td>
            </tr>
            <tr><td style="padding-top:24px;font-size:12px;line-height:18px;color:#8d95a8">Vous n'avez pas demandé ce lien ? Ignorez cet email : personne ne pourra se connecter sans lui.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
